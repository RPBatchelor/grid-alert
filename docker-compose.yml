# Pilot deployment: the app plus a Cloudflare Tunnel (secure public access, no open router ports).
# See DEPLOY.md. Start just the app first:  docker compose up -d app
# then, once TUNNEL_TOKEN is in .env:       docker compose up -d
services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: grid-alert:latest
    container_name: grid-alert-app
    restart: unless-stopped
    environment:
      - TZ=Australia/Melbourne
      - COLLECT_INTERVAL_MINUTES=${COLLECT_INTERVAL_MINUTES:-5}
      # Sign-in and email (see .env.example and DEPLOY.md steps 4 and 6)
      - APP_URL=${APP_URL:-https://grid-alert.com}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_NAME=${ADMIN_NAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NOTIFY_EMAIL=${ADMIN_NOTIFY_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Grid Alert Victoria <noreply@grid-alert.com>}
    volumes:
      - ./data:/data
    # Local-network access for setup and checks (http://helly:8080). The app's own sign-in
    # still applies; remove these two lines if you only want access through the tunnel.
    ports:
      - "8080:8080"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: grid-alert-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}   # from .env (DEPLOY.md step 7b)
    depends_on:
      - app
